name: Analyze (develop only)

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get > PUBGET.md 2>&1 || true
      - run: flutter analyze > ANALYZE.md 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-report
          path: |
            PUBGET.md
            ANALYZE.md
