name: Analyze (develop only)

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  analyze:
    if: "!contains(github.event.head_commit.message, '[analyze-report]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get > PUBGET.md 2>&1 || true
      - run: flutter analyze > ANALYZE.md 2>&1 || true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ANALYZE.md', 'utf8');
            const pubget = fs.readFileSync('PUBGET.md', 'utf8');
            const content = '## flutter pub get\n```\n' + pubget + '\n```\n\n## flutter analyze\n```\n' + report + '\n```';
            const owner = context.repo.owner, repo = context.repo.repo;
            const b = 'analyze-report';
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: b });
            } catch (e) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/develop' });
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + b, sha: ref.data.object.sha });
            }
            let sha;
            try {
              const cur = await github.rest.repos.getContent({ owner, repo, path: 'ANALYZE.md', ref: b });
              sha = cur.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'ANALYZE.md', branch: b,
              message: 'analyze report',
              content: Buffer.from(content).toString('base64'),
              sha
            });
