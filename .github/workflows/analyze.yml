name: Analyze (develop only)

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get > pubget.txt 2>&1 || true
      - run: flutter analyze > analyze_report.txt 2>&1 || true
      - run: cat analyze_report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-report
          path: |
            analyze_report.txt
            pubget.txt
