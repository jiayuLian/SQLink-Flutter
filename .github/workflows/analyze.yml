name: Analyze (develop only)

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  analyze:
    if: "!contains(github.event.head_commit.message, '[analyze-report]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get > PUBGET.md 2>&1 || true
      - run: flutter analyze > ANALYZE.md 2>&1 || true
      - name: emit annotations
        continue-on-error: true
        run: |
          if [ -f ANALYZE.md ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error::$line"
            done < ANALYZE.md
          fi
