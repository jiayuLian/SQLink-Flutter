name: Build APK & IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  build_apk:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate native project (android)
        run: |
          flutter create --platforms=android --org com.jiayu sqlink
          cp -r sqlink/android .
          rm -rf sqlink
      - name: Set app display name
        run: sed -i 's/android:label="sqlink"/android:label="SQLink"/' android/app/src/main/AndroidManifest.xml
      - name: Replace app icon
        run: |
          # 移除自适应图标配置，确保使用单张 PNG 作为应用图标。
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-mdpi \
                   android/app/src/main/res/mipmap-hdpi \
                   android/app/src/main/res/mipmap-xhdpi \
                   android/app/src/main/res/mipmap-xxhdpi \
                   android/app/src/main/res/mipmap-xxxhdpi; do
            cp assets/icon/android/ic_launcher_$(basename "$d" | cut -d- -f2).png "$d/ic_launcher.png"
          done
      - name: Bump minSdkVersion to 23 (flutter_secure_storage 的 encryptedSharedPreferences 需 API 23+)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk = .*/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle
          fi
      - name: Build release APK (仅 arm64-v8a，市面上最主流架构)
        run: flutter build apk --release --target-platform=android-arm64 --tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ipa:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate native project (ios)
        run: |
          flutter create --platforms=ios --org com.jiayu sqlink
          cp -r sqlink/ios .
          rm -rf sqlink
      - name: Set app display name & allow arbitrary loads
        run: |
          plutil -replace CFBundleDisplayName -string SQLink ios/Runner/Info.plist
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}' ios/Runner/Info.plist
      - name: Replace app icon
        run: |
          rm -f ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
          cp assets/icon/ios/*.png ios/Runner/Assets.xcassets/AppIcon.appiconset/
          cp assets/icon/ios/Contents.json ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (TrollStore)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SQLink.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ios/iphoneos/SQLink.ipa

  release:
    needs: [build_apk, build_ipa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: ipa
          path: ipa
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: |
            apk/app-release.apk
            ipa/SQLink.ipa
