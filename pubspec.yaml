name: sqlink_flutter
description: SQLink - 远程 MySQL 客户端（Android / iOS），Flutter 重写版。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mysql_client_plus: ^0.1.2
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  share_plus: ^10.0.0
  flutter_slidable: ^3.1.1
  # 「检查更新」用：读本机安装的版本号 / 构建号，以及打开下载页
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
