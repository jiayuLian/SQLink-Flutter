publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mysql_client_plus: ^0.1.2
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  share_plus: ^10.0.0
  cross_file: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
